@if (authService.isAuthenticated()) {
  <nav class="app-nav" aria-label="Main navigation">
    <a routerLink="/recipes" class="app-nav__brand brand">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M5 8h14l-1 12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 8Z" />
        <path d="M9 8V6a3 3 0 0 1 6 0v2" />
      </svg>
      Stocked
    </a>
    <div class="app-nav__links">
      <a routerLink="/recipes" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Recipes</a>
      <a routerLink="/recipes/favorites" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Favorites</a>
      <a routerLink="/recipes/recent" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Recent</a>
      <a routerLink="/pantry" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Pantry</a>
    </div>
    <button type="button" class="app-nav__action" (click)="logout()">Logout</button>
  </nav>
}

<router-outlet />
