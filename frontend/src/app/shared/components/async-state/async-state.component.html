@switch (state()) {
  @case ('loading') {
    <div class="async-state async-state--loading" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading</p>
    </div>
  }
  @case ('error') {
    <div class="async-state async-state--error" role="alert">
      <svg class="async-state__icon" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9" />
        <line x1="12" y1="8" x2="12" y2="13" />
        <line x1="12" y1="16" x2="12" y2="16.01" />
      </svg>
      <p class="error-text">{{ errorMessage() }}</p>
      <button type="button" class="btn btn--tonal" (click)="retry.emit()">Retry</button>
    </div>
  }
  @case ('empty') {
    <div class="async-state async-state--empty">
      <svg class="async-state__icon async-state__icon--muted" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M4 12h4l2 3h4l2-3h4" />
        <path d="M4 12l1.5-6.5A2 2 0 0 1 7.44 4h9.12a2 2 0 0 1 1.94 1.5L20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6Z" />
      </svg>
      <p>{{ emptyMessage() }}</p>
    </div>
  }
  @case ('success') {
    <ng-content />
  }
}
